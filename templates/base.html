<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FinFlow{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('home.index') }}">FinFlow</a>
    <nav>
      <a href="{{ url_for('home.index') }}">Dashboard</a>
      <a href="{{ url_for('accounts.list_accounts') }}">Accounts</a>
      <a href="{{ url_for('search.search') }}">Search</a>
      <a href="{{ url_for('payments.transfer') }}">Transfer</a>
      <a href="{{ url_for('support.new_ticket') }}">Support</a>
      <a href="{{ url_for('auth.login') }}">Log in</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <small>FinFlow &middot; demo application</small>
  </footer>
</body>
</html>
