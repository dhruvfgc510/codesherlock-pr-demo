{% extends "base.html" %}
{% block title %}Support ticket &middot; FinFlow{% endblock %}
{% block content %}
  <h1>New support ticket</h1>
  <p class="muted">Reference: {{ ref }}</p>
  {% if subject %}
  <p>Subject: {{ subject }}</p>
  {% endif %}
  <form method="get" action="{{ url_for('support.new_ticket') }}" class="form">
    <label>Subject <input type="text" name="subject" value="{{ subject }}"></label>
    <button type="submit">Create ticket</button>
  </form>
{% endblock %}
