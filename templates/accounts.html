{% extends "base.html" %}
{% block title %}Accounts &middot; FinFlow{% endblock %}
{% block content %}
  <h1>Accounts</h1>
  <table class="data">
    <thead>
      <tr><th>Number</th><th>Owner</th><th>Type</th><th class="num">Balance</th></tr>
    </thead>
    <tbody>
      {% for a in accounts %}
      <tr>
        <td><a href="{{ url_for('accounts.view_account', account_id=a.id) }}">{{ a.account_number }}</a></td>
        <td>{{ a.full_name }}</td>
        <td>{{ a.account_type }}</td>
        <td class="num">${{ '%.2f' | format(a.balance_cents / 100) }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
