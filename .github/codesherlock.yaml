# Trigger reviews for PRs targeting these branches
target_branches: ["main", "develop"]

# Focus review on these quality characteristics
preferred_characteristics: ["Modularity", "Resource Utilization", "Exception Handling", "Monitoring and Logging", "Code Injection", "Input Validation", "Identity & Cryptographic Controls"]

# Show all severities, not just critical/high (default is critical + high)
severity_levels: ["critical", "high", "medium", "low"]

